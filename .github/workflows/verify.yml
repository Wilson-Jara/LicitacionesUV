name: verify

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # PostgreSQL desechable para las pruebas de integración del backend.
      # Las credenciales son solo de CI y no protegen datos reales.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: licitaciones_ci
          POSTGRES_PASSWORD: licitaciones_ci
          POSTGRES_DB: licitaciones_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U licitaciones_ci -d licitaciones_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://licitaciones_ci:licitaciones_ci@localhost:5432/licitaciones_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 es necesario para los umbrales de cobertura de node --test
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm run verify
      # Cobertura con umbrales: si no se alcanza la meta, el CI queda en rojo
      - run: npm run test:coverage
      - run: npm run test:coverage:critico
