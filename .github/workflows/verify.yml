name: verify

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 es necesario para los umbrales de cobertura de node --test
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run verify
      # Cobertura con umbrales: si no se alcanza la meta, el CI queda en rojo
      - run: npm run test:coverage
      - run: npm run test:coverage:critico
